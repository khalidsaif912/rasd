name: sync

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: rasd-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || (github.actor == 'khalidsaif912' && (startsWith(github.event.issue.title, 'account:') || startsWith(github.event.issue.title, 'remove:')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: update account list
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.issue.title || '' }}
        run: python server.py --prepare

      - name: install browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: read accounts
        run: python server.py --sync

      - name: publish summaries
        run: |
          git add data/store.json
          git diff --cached --quiet && exit 0
          git -c user.name="rasd" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "تحديث الملخصات"
          git push

      - name: close request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --comment "تمت المتابعة على خادم GitHub"
